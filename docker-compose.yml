version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "3050:3050"
    volumes:
      - ./frontend:/app:delegated
      - node_modules_frontend:/app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:9000
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "9000:9000"
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000

      # Matches the mounted volume below, so the embedding model isn't
      # re-downloaded on every container rebuild.
      - FASTEMBED_CACHE_DIR=/root/.cache/fastembed

      # Database
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ragdb

      # Auth. Override JWT_SECRET_KEY with a real random secret before
      # deploying anywhere; ENVIRONMENT=production refuses to start without it.
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-change-me}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3050,http://localhost:3000}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}

      # AI
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_PROVIDER=${LLM_PROVIDER}

      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
   
      - CHROMA_TELEMETRY_ENABLED=false

    depends_on:
      - chromadb
      - postgres

    volumes:
      - ./backend:/app
      - fastembed_cache:/root/.cache/fastembed

  chromadb:
    image: chromadb/chroma:0.5.23
    ports:
      - "8002:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped


  postgres:
    image: postgres:16
    container_name: rag_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped


volumes:
  chroma_data:
  postgres_data:
  node_modules_frontend:
  fastembed_cache:
